name: Publish

# Release by pushing a version tag: git tag v0.1.0 && git push origin v0.1.0
# Publishing uses PyPI trusted publishing (OIDC): no API token is stored anywhere.
# Configured on pypi.org as a pending publisher:
#   owner aswin-kevin, repository haltwise, workflow publish.yml, environment "pypi".

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    name: Test and build
    runs-on: ubuntu-latest
    steps:
      # Third-party actions are pinned to full commit SHAs (supply-chain hardening).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.11.27"
      - run: uv sync --locked --extra datasets
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run pytest --cov=haltwise --cov-fail-under=90
      - name: Check the tag matches the package version
        run: |
          version=$(uv run python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          test "v${version}" = "${GITHUB_REF_NAME}" || { echo "tag ${GITHUB_REF_NAME} != v${version}"; exit 1; }
      - run: uv build
      - name: Check numpy is the only required runtime dependency
        run: |
          unzip -p dist/*.whl '*.dist-info/METADATA' > METADATA
          required=$(grep '^Requires-Dist:' METADATA | grep -v 'extra ==' || true)
          echo "${required}"
          test "$(echo "${required}" | grep -c .)" = "1" && echo "${required}" | grep -q '^Requires-Dist: numpy'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  pypi:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/haltwise
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
